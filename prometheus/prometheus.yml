global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: order-service
    static_configs:
      - targets: ["order-service:8000"]

  - job_name: barista-service
    static_configs:
      - targets: ["barista-service:8001"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
